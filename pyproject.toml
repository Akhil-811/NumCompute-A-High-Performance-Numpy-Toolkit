[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "NumCompute: A modular ML framework built from scratch using NumPy"
authors = [
    { name = "Eruva Akhil" }
]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.21"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["numcompute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"